name: Test word game

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check audio-engine.js
          node --check game_ver2.js
          node --check tests/static-check.cjs
          node --check tests/audio-engine.cjs
          node --check tests/game-smoke.cjs

      - name: Run regression checks
        run: |
          node tests/static-check.cjs
          node tests/audio-engine.cjs
          node tests/game-smoke.cjs
