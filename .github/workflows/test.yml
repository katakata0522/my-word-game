name: Test word game

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check words.js
          node --check game-state.js
          node --check storage.js
          node --check audio-engine.js
          node --check game-ui.js
          node --check tests/static-check.cjs
          node --check tests/audio-engine.cjs
          node --check tests/game-smoke.cjs
          node --check tests/words.cjs
          node --check tests/storage.cjs
          node --check tests/static-server.cjs
          node --check tests/browser.spec.cjs
          node --check playwright.config.cjs

      - name: Run regression checks
        run: npm test

      - name: Validate HTML
        run: npm run validate:html

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
